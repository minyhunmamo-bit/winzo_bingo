<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin · Bingo Server</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a2a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
            color: #d4e6fa;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Login */
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            background: rgba(20, 45, 70, 0.6);
            border-radius: 24px;
            padding: 35px 30px;
            border: 1px solid rgba(60, 120, 170, 0.15);
        }
        .login-container .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-container .logo h1 {
            color: #f5e7c8;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 3px 0 #6f4a2a;
        }
        .login-container .logo h1 span {
            color: #f5c542;
        }
        .login-container .subtitle {
            color: #8ab0c8;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: -4px;
            margin-bottom: 20px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 30px;
            border: 2px solid rgba(60, 120, 170, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #d4e6fa;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-container input:focus {
            border-color: #f5c542;
            box-shadow: 0 0 0 4px rgba(245, 197, 66, 0.1);
        }
        .login-container input::placeholder {
            color: #4a6a8a;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #f5c542, #e6a820);
            color: #1a2a1a;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #8f6a1a;
        }
        .login-container button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 0 #8f6a1a;
        }
        .login-container button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #8f6a1a;
        }
        .login-container .error {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            min-height: 1.2rem;
        }
        .login-container .status {
            text-align: center;
            font-size: 0.75rem;
            color: #6a8aaa;
            margin-top: 10px;
        }
        .login-container .status.online {
            color: #7ddfa0;
        }
        .login-container .status.offline {
            color: #ff6b6b;
        }

        /* Dashboard */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid rgba(60, 120, 170, 0.2);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .dashboard-header .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .dashboard-header h1 {
            color: #f5e7c8;
            font-size: 1.6rem;
            letter-spacing: 2px;
        }
        .dashboard-header h1 span {
            color: #f5c542;
        }
        .dashboard-header .badge {
            background: rgba(245, 197, 66, 0.15);
            color: #f5c542;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid rgba(245, 197, 66, 0.2);
        }
        .dashboard-header .badge.super {
            background: rgba(125, 223, 160, 0.15);
            color: #7ddfa0;
            border-color: rgba(125, 223, 160, 0.2);
        }
        .dashboard-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .dashboard-header .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .dashboard-header .status-dot.online {
            background: #7ddfa0;
            box-shadow: 0 0 10px rgba(125, 223, 160, 0.3);
        }
        .dashboard-header .status-dot.offline {
            background: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
        }
        .dashboard-header .status-text {
            color: #8ab0c8;
            font-size: 0.8rem;
        }
        .dashboard-header .btn {
            background: rgba(40, 80, 120, 0.3);
            border: 1px solid rgba(60, 120, 170, 0.15);
            border-radius: 30px;
            padding: 6px 16px;
            color: #8ab0c8;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .dashboard-header .btn:hover {
            background: rgba(40, 80, 120, 0.5);
        }
        .dashboard-header .btn.logout:hover {
            background: rgba(200, 70, 70, 0.15);
            color: #ff8a8a;
        }
        .dashboard-header .btn:active {
            transform: scale(0.95);
        }

        /* Grid */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .admin-card {
            background: rgba(20, 45, 70, 0.5);
            border-radius: 20px;
            padding: 18px 20px 20px;
            border: 1px solid rgba(60, 120, 170, 0.12);
            backdrop-filter: blur(4px);
        }
        .admin-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(60, 120, 170, 0.1);
        }
        .admin-card .card-header h2 {
            color: #f5e7c8;
            font-size: 1rem;
            font-weight: 700;
        }
        .admin-card .card-header .count {
            color: #8ab0c8;
            font-size: 0.75rem;
            font-weight: 400;
        }

        /* Filters */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-bar select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(60, 120, 170, 0.15);
            border-radius: 30px;
            padding: 4px 12px;
            color: #d4e6fa;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }
        .filter-bar select:focus {
            border-color: #f5c542;
        }
        .filter-bar select option {
            background: #1a2f44;
            color: #d4e6fa;
        }

        /* Transaction List */
        .transaction-list {
            max-height: 480px;
            overflow-y: auto;
        }
        .transaction-list::-webkit-scrollbar {
            width: 4px;
        }
        .transaction-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }
        .transaction-list::-webkit-scrollbar-thumb:hover {
            background: rgba(80, 150, 200, 0.5);
        }

        .tx-date-group {
            margin-bottom: 10px;
        }
        .tx-date-group .date-label {
            color: #6a8aaa;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .tx-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-left: 4px solid #f5d76e;
            transition: all 0.3s;
        }
        .tx-item.approved {
            border-left-color: #7ddfa0;
            opacity: 0.7;
        }
        .tx-item.rejected {
            border-left-color: #ff6b6b;
            opacity: 0.7;
        }
        .tx-item .tx-info {
            flex: 1;
            min-width: 100px;
        }
        .tx-item .tx-info .user {
            font-weight: 700;
            color: #f5e7c8;
            font-size: 0.85rem;
        }
        .tx-item .tx-info .user .type-badge {
            font-weight: 400;
            color: #8ab0c8;
            font-size: 0.7rem;
            margin-left: 6px;
        }
        .tx-item .tx-info .details {
            font-size: 0.65rem;
            color: #6a8aaa;
        }
        .tx-item .tx-amount {
            font-weight: 800;
            font-size: 0.95rem;
            color: #f5c542;
        }
        .tx-item .tx-actions {
            display: flex;
            gap: 4px;
        }
        .tx-item .tx-actions button {
            padding: 3px 12px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tx-item .tx-actions .approve {
            background: #2a8a4a;
            color: #f0fff0;
        }
        .tx-item .tx-actions .approve:hover {
            background: #3aaa5a;
        }
        .tx-item .tx-actions .reject {
            background: #8a2a2a;
            color: #fff0f0;
        }
        .tx-item .tx-actions .reject:hover {
            background: #aa3a3a;
        }
        .tx-item .tx-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .tx-item .tx-status {
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .tx-item .tx-status.pending {
            background: rgba(200, 180, 60, 0.2);
            color: #f5d76e;
        }
        .tx-item .tx-status.approved {
            background: rgba(70, 200, 120, 0.2);
            color: #7ddfa0;
        }
        .tx-item .tx-status.rejected {
            background: rgba(200, 70, 70, 0.2);
            color: #ff8a8a;
        }

        /* Player List */
        .player-list {
            max-height: 280px;
            overflow-y: auto;
        }
        .player-list::-webkit-scrollbar {
            width: 4px;
        }
        .player-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .player-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }

        .player-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 6px 12px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .player-item .p-name {
            font-weight: 700;
            color: #f5e7c8;
            font-size: 0.85rem;
        }
        .player-item .p-wallets {
            display: flex;
            gap: 10px;
            font-size: 0.7rem;
        }
        .player-item .p-wallets span {
            color: #8ab0c8;
        }
        .player-item .p-wallets .main {
            color: #f5c542;
        }
        .player-item .p-wallets .play {
            color: #7ddfa0;
        }

        .empty-state {
            color: #4a6a8a;
            text-align: center;
            padding: 16px 0;
            font-size: 0.8rem;
        }

        /* Admin Management */
        .admin-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(60, 120, 170, 0.08);
        }
        .admin-section .section-title {
            color: #8ab0c8;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .admin-actions input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(60, 120, 170, 0.15);
            border-radius: 30px;
            padding: 4px 12px;
            color: #d4e6fa;
            font-size: 0.75rem;
            outline: none;
            flex: 1;
            min-width: 80px;
        }
        .admin-actions input:focus {
            border-color: #f5c542;
        }
        .admin-actions input::placeholder {
            color: #4a6a8a;
        }
        .admin-actions .add-btn {
            background: rgba(70, 200, 120, 0.15);
            border: 1px solid rgba(70, 200, 120, 0.2);
            border-radius: 30px;
            padding: 4px 14px;
            color: #7ddfa0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .admin-actions .add-btn:hover {
            background: rgba(70, 200, 120, 0.25);
        }

        .admin-list {
            margin-top: 6px;
        }
        .admin-list .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 8px;
            border-bottom: 1px solid rgba(60, 120, 170, 0.05);
            font-size: 0.8rem;
        }
        .admin-list .admin-item .role-tag {
            color: #6a8aaa;
            font-size: 0.65rem;
        }
        .admin-list .admin-item .role-tag.super {
            color: #7ddfa0;
        }
        .admin-list .admin-item .remove-btn {
            background: transparent;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 0.7rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .admin-list .admin-item .remove-btn:hover {
            opacity: 1;
        }

        .no-access {
            color: #6a8aaa;
            text-align: center;
            font-size: 0.8rem;
            padding: 10px 0;
        }

        @media (max-width: 380px) {
            .login-container {
                padding: 20px 16px;
                margin: 40px auto;
            }
            .login-container .logo h1 {
                font-size: 1.6rem;
            }
            .dashboard-header h1 {
                font-size: 1.2rem;
            }
            .admin-card {
                padding: 12px 14px 16px;
            }
            .tx-item {
                padding: 6px 10px;
            }
            .tx-item .tx-info .user {
                font-size: 0.75rem;
            }
            .tx-item .tx-amount {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container" id="adminApp">
        <!-- ========== LOGIN ========== -->
        <div id="loginSection" class="login-container">
            <div class="logo">
                <h1>🎯 <span>BINGO</span></h1>
                <div class="subtitle">Admin Dashboard</div>
            </div>
            <div id="loginError" class="error"></div>
            <input type="text" id="loginUsername" placeholder="Username" value="superadmin" />
            <input type="password" id="loginPassword" placeholder="Password" value="super123" />
            <button id="loginBtn">Login</button>
            <div class="status" id="connectionStatus">🔌 Connecting...</div>
        </div>

        <!-- ========== DASHBOARD ========== -->
        <div id="dashboardSection" style="display:none;">
            <!-- Header -->
            <div class="dashboard-header">
                <div class="left">
                    <h1>🎯 <span>BINGO</span> · Admin</h1>
                    <span class="badge" id="roleBadge">Admin</span>
                </div>
                <div class="right">
                    <span class="status-text">
                        <span class="status-dot online" id="statusDot"></span>
                        <span id="statusText">Online</span>
                    </span>
                    <button class="btn refresh" id="refreshBtn">⟳ Refresh</button>
                    <button class="btn logout" id="logoutBtn">🚪 Logout</button>
                </div>
            </div>

            <!-- Grid -->
            <div class="admin-grid">
                <!-- Transactions -->
                <div class="admin-card">
                    <div class="card-header">
                        <h2>📋 Transactions</h2>
                        <span class="count" id="txCount">(0)</span>
                    </div>
                    <div class="filter-bar">
                        <select id="filterType">
                            <option value="all">All Types</option>
                            <option value="deposit">Deposit</option>
                            <option value="withdraw">Withdraw</option>
                        </select>
                        <select id="filterStatus">
                            <option value="all">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="transaction-list" id="transactionList">
                        <div class="empty-state">Loading transactions...</div>
                    </div>
                </div>

                <!-- Players & Admins -->
                <div class="admin-card">
                    <div class="card-header">
                        <h2>👥 Players</h2>
                        <span class="count" id="playerCount">(0)</span>
                    </div>
                    <div class="player-list" id="playerList">
                        <div class="empty-state">Loading players...</div>
                    </div>

                    <!-- Admin Management (Super Admin only) -->
                    <div class="admin-section" id="adminSection">
                        <div class="section-title">🔐 Admin Management</div>
                        <div class="admin-actions" id="adminActions">
                            <input type="text" id="newAdminUsername" placeholder="Username" />
                            <input type="password" id="newAdminPassword" placeholder="Password" />
                            <button class="add-btn" id="addAdminBtn">➕ Add</button>
                        </div>
                        <div class="admin-list" id="adminList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDtrK2x0gwnnIXu0m0EseEHkVHqsP1nPCI",
            authDomain: "my-bingo-game-83df1.firebaseapp.com",
            databaseURL: "https://my-bingo-game-83df1-default-rtdb.firebaseio.com",
            projectId: "my-bingo-game-83df1",
            storageBucket: "my-bingo-game-83df1.firebasestorage.app",
            messagingSenderId: "750488641763",
            appId: "1:750488641763:web:494503b5f3f99daedc25d6"
        };

        let database = null;
        let currentUser = null;
        let isSuperAdmin = false;
        let isLoggedIn = false;

        // ============================================================
        //  INIT FIREBASE
        // ============================================================
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log('✅ Firebase connected');
            document.getElementById('connectionStatus').textContent = '🟢 Connected';
            document.getElementById('connectionStatus').className = 'status online';
        } catch (e) {
            console.error('Firebase init error:', e);
            document.getElementById('connectionStatus').textContent = '🔴 Firebase error';
            document.getElementById('connectionStatus').className = 'status offline';
        }

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const loginSection = $('loginSection');
        const dashboardSection = $('dashboardSection');
        const loginError = $('loginError');
        const loginUsername = $('loginUsername');
        const loginPassword = $('loginPassword');
        const loginBtn = $('loginBtn');
        const logoutBtn = $('logoutBtn');
        const refreshBtn = $('refreshBtn');
        const roleBadge = $('roleBadge');
        const statusText = $('statusText');
        const statusDot = $('statusDot');
        const txCount = $('txCount');
        const playerCount = $('playerCount');
        const transactionList = $('transactionList');
        const playerList = $('playerList');
        const adminList = $('adminList');
        const filterType = $('filterType');
        const filterStatus = $('filterStatus');
        const adminSection = $('adminSection');
        const adminActions = $('adminActions');
        const newAdminUsername = $('newAdminUsername');
        const newAdminPassword = $('newAdminPassword');
        const addAdminBtn = $('addAdminBtn');

        // ============================================================
        //  CHECK IF ADMINS EXIST – Initialize if empty
        // ============================================================
        function initializeAdmins() {
            if (!database) return;
            const adminsRef = database.ref('admins');
            adminsRef.once('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    // Create default admins
                    const defaults = {
                        admin: { password: 'admin123', role: 'admin' },
                        superadmin: { password: 'super123', role: 'superadmin' }
                    };
                    adminsRef.set(defaults).then(() => {
                        console.log('✅ Default admins created');
                    }).catch(err => {
                        console.error('Error creating admins:', err);
                    });
                }
            });
        }

        // ============================================================
        //  LOGIN
        // ============================================================
        function login() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Please fill in all fields.';
                return;
            }

            if (!database) {
                loginError.textContent = 'Firebase not connected.';
                return;
            }

            loginError.textContent = '';
            loginBtn.textContent = '⏳ Checking...';
            loginBtn.disabled = true;

            // Check admins node
            const adminsRef = database.ref('admins');
            adminsRef.child(username).once('value', snapshot => {
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;

                const data = snapshot.val();

                if (!data) {
                    loginError.textContent = '❌ Admin not found.';
                    return;
                }

                if (data.password !== password) {
                    loginError.textContent = '❌ Invalid password.';
                    return;
                }

                // Login successful
                currentUser = username;
                isSuperAdmin = data.role === 'superadmin';
                isLoggedIn = true;

                loginError.textContent = '';
                showDashboard();
                loadData();

            }).catch(err => {
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;
                loginError.textContent = '❌ Error: ' + err.message;
            });
        }

        // ============================================================
        //  LOGOUT
        // ============================================================
        function logout() {
            // Detach listeners
            if (database) {
                database.ref('transactions').off();
                database.ref('users').off();
                database.ref('admins').off();
            }
            currentUser = null;
            isSuperAdmin = false;
            isLoggedIn = false;
            showLogin();
        }

        // ============================================================
        //  UI SWITCH
        // ============================================================
        function showLogin() {
            loginSection.style.display = 'block';
            dashboardSection.style.display = 'none';
            loginUsername.value = '';
            loginPassword.value = '';
            loginError.textContent = '';
        }

        function showDashboard() {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            roleBadge.textContent = isSuperAdmin ? '👑 Super Admin' : 'Admin';
            roleBadge.className = 'badge' + (isSuperAdmin ? ' super' : '');
            document.getElementById('adminSection').style.display = isSuperAdmin ? 'block' : 'none';
            setStatus(true, 'Online');
        }

        function setStatus(online, text) {
            statusDot.className = 'status-dot ' + (online ? 'online' : 'offline');
            statusText.textContent = text || (online ? 'Online' : 'Offline');
        }

        // ============================================================
        //  LOAD DATA
        // ============================================================
        function loadData() {
            if (!database || !isLoggedIn) return;

            // Transactions
            const txRef = database.ref('transactions');
            txRef.orderByChild('timestamp').limitToLast(200).on('value', snapshot => {
                const data = snapshot.val();
                renderTransactions(data);
            });

            // Players (users)
            const usersRef = database.ref('users');
            usersRef.on('value', snapshot => {
                const data = snapshot.val();
                renderPlayers(data);
            });

            // Admins (for super admin)
            if (isSuperAdmin) {
                const adminsRef = database.ref('admins');
                adminsRef.on('value', snapshot => {
                    const data = snapshot.val();
                    renderAdmins(data);
                });
            }
        }

        // ============================================================
        //  RENDER TRANSACTIONS
        // ============================================================
        function renderTransactions(data) {
            const filterTypeVal = filterType.value;
            const filterStatusVal = filterStatus.value;

            if (!data) {
                transactionList.innerHTML = '<div class="empty-state">No transactions</div>';
                txCount.textContent = '(0)';
                return;
            }

            const entries = Object.values(data).reverse();
            let filtered = entries.filter(tx => {
                if (filterTypeVal !== 'all' && tx.type !== filterTypeVal) return false;
                if (filterStatusVal !== 'all' && tx.status !== filterStatusVal) return false;
                return true;
            });

            txCount.textContent = `(${filtered.length})`;

            if (filtered.length === 0) {
                transactionList.innerHTML = '<div class="empty-state">No transactions match filters</div>';
                return;
            }

            // Group by date
            const groups = {};
            filtered.forEach(tx => {
                const date = new Date(tx.timestamp).toLocaleDateString();
                if (!groups[date]) groups[date] = [];
                groups[date].push(tx);
            });

            let html = '';
            Object.keys(groups).sort().reverse().forEach(date => {
                html += `<div class="tx-date-group"><div class="date-label">📅 ${date}</div>`;
                groups[date].forEach(tx => {
                    const statusClass = tx.status || 'pending';
                    const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
                    const isPending = statusClass === 'pending';
                    const typeIcon = tx.type === 'deposit' ? '💰' : '🏦';
                    const typeLabel = tx.type === 'deposit' ? 'Deposit' : 'Withdraw';

                    html += `
                        <div class="tx-item ${statusClass}">
                            <div class="tx-info">
                                <div class="user">${tx.username || 'Unknown'} <span class="type-badge">${typeIcon} ${typeLabel}</span></div>
                                <div class="details">${new Date(tx.timestamp).toLocaleTimeString()}</div>
                            </div>
                            <div class="tx-amount">${tx.amount || 0} Birr</div>
                            <span class="tx-status ${statusClass}">${statusLabel}</span>
                            ${isPending ? `
                            <div class="tx-actions">
                                <button class="approve" onclick="approveTransaction('${tx.id}')">✅</button>
                                <button class="reject" onclick="rejectTransaction('${tx.id}')">❌</button>
                            </div>` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            });

            transactionList.innerHTML = html;
        }

        // ============================================================
        //  RENDER PLAYERS
        // ============================================================
        function renderPlayers(data) {
            if (!data) {
                playerList.innerHTML = '<div class="empty-state">No players registered</div>';
                playerCount.textContent = '(0)';
                return;
            }

            const entries = Object.entries(data);
            playerCount.textContent = `(${entries.length})`;

            if (entries.length === 0) {
                playerList.innerHTML = '<div class="empty-state">No players registered</div>';
                return;
            }

            let html = '';
            entries.forEach(([username, userData]) => {
                const main = userData.mainWallet || 0;
                const play = userData.playWallet || 0;
                html += `
                    <div class="player-item">
                        <span class="p-name">${username}</span>
                        <div class="p-wallets">
                            <span class="main">💰 ${main}</span>
                            <span class="play">🎰 ${play}</span>
                        </div>
                    </div>
                `;
            });
            playerList.innerHTML = html;
        }

        // ============================================================
        //  RENDER ADMINS (Super admin only)
        // ============================================================
        function renderAdmins(data) {
            if (!data) {
                adminList.innerHTML = '<div class="empty-state">No admins</div>';
                return;
            }

            if (!isSuperAdmin) {
                adminList.innerHTML = '<div class="no-access">Only Super Admin can manage admins</div>';
                return;
            }

            const entries = Object.entries(data);
            let html = '';
            entries.forEach(([username, adminData]) => {
                const role = adminData.role || 'admin';
                const isSelf = username === currentUser;
                html += `
                    <div class="admin-item">
                        <span>${username} <span class="role-tag${role === 'superadmin' ? ' super' : ''}">(${role})</span></span>
                        ${!isSelf ? `<button class="remove-btn" onclick="removeAdmin('${username}')">✕ Remove</button>` : '<span style="color:#4a6a8a;font-size:0.65rem;">(you)</span>'}
                    </div>
                `;
            });
            adminList.innerHTML = html || '<div class="empty-state">No admins</div>';
        }

        // ============================================================
        //  TRANSACTION ACTIONS
        // ============================================================
        function approveTransaction(txId) {
            if (!database || !isLoggedIn) return;
            const txRef = database.ref('transactions/' + txId);
            txRef.once('value', snapshot => {
                const data = snapshot.val();
                if (!data || data.status !== 'pending') {
                    alert('Transaction already processed.');
                    return;
                }

                const username = data.username;
                const amount = parseInt(data.amount);
                const type = data.type;

                // Update user wallet
                const userRef = database.ref('users/' + username);
                userRef.once('value', userSnapshot => {
                    const userData = userSnapshot.val() || { mainWallet: 0, playWallet: 0 };

                    if (type === 'deposit') {
                        userData.playWallet = (userData.playWallet || 0) + amount;
                    } else if (type === 'withdraw') {
                        const currentMain = userData.mainWallet || 0;
                        userData.mainWallet = Math.max(0, currentMain - amount);
                    }

                    userRef.set(userData);

                    // Mark transaction as approved
                    txRef.update({ status: 'approved', processedAt: Date.now() });
                });
            }).catch(err => {
                alert('Error: ' + err.message);
            });
        }

        function rejectTransaction(txId) {
            if (!database || !isLoggedIn) return;
            if (!confirm('Reject this transaction?')) return;
            const txRef = database.ref('transactions/' + txId);
            txRef.update({ status: 'rejected', processedAt: Date.now() }).catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ============================================================
        //  ADMIN MANAGEMENT (Super admin only)
        // ============================================================
        function addAdmin() {
            if (!isSuperAdmin) {
                alert('Only Super Admin can add admins.');
                return;
            }
            const username = newAdminUsername.value.trim();
            const password = newAdminPassword.value.trim();
            if (!username || !password) {
                alert('Enter both username and password.');
                return;
            }
            if (username.length < 3) {
                alert('Username must be at least 3 characters.');
                return;
            }
            if (password.length < 4) {
                alert('Password must be at least 4 characters.');
                return;
            }

            const adminsRef = database.ref('admins');
            adminsRef.child(username).once('value', snapshot => {
                if (snapshot.exists()) {
                    alert('Admin already exists.');
                    return;
                }
                adminsRef.child(username).set({
                    password: password,
                    role: 'admin'
                }).then(() => {
                    newAdminUsername.value = '';
                    newAdminPassword.value = '';
                    alert('✅ Admin added successfully.');
                }).catch(err => {
                    alert('Error: ' + err.message);
                });
            });
        }

        function removeAdmin(username) {
            if (!isSuperAdmin) return;
            if (username === currentUser) {
                alert('You cannot remove yourself.');
                return;
            }
            if (!confirm(`Remove admin "${username}"?`)) return;
            const adminsRef = database.ref('admins');
            adminsRef.child(username).remove().catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ============================================================
        //  FILTER CHANGE
        // ============================================================
        filterType.onchange = () => { loadData(); };
        filterStatus.onchange = () => { loadData(); };

        // ============================================================
        //  REFRESH
        // ============================================================
        refreshBtn.onclick = () => {
            if (database) {
                database.ref('transactions').off();
                database.ref('users').off();
                database.ref('admins').off();
                loadData();
                setStatus(true, 'Refreshing...');
                setTimeout(() => {
                    setStatus(true, 'Online');
                }, 600);
            }
        };

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        loginUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        newAdminUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') addAdmin(); });
        newAdminPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') addAdmin(); });

        // ============================================================
        //  EVENT BINDINGS
        // ============================================================
        loginBtn.onclick = login;
        logoutBtn.onclick = logout;
        addAdminBtn.onclick = addAdmin;

        // Expose functions globally for inline onclick handlers
        window.approveTransaction = approveTransaction;
        window.rejectTransaction = rejectTransaction;
        window.removeAdmin = removeAdmin;

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            if (database) {
                initializeAdmins();
                // Check if there's a saved session (optional)
                showLogin();
                setStatus(true, 'Connected');
            } else {
                document.getElementById('connectionStatus').textContent = '🔴 Firebase unavailable';
                document.getElementById('connectionStatus').className = 'status offline';
            }
        }

        init();
    </script>
</body>
</html>
